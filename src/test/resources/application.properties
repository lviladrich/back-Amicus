# ============================================================
# Configuracion de los tests.
#
# El perfil por defecto de la aplicacion apunta a MySQL, que en los
# tests significaria depender de que Docker este levantado: el test
# no fallaria por un error del codigo sino por una base ausente.
#
# Aca se usa H2 en memoria. Se crea al arrancar el contexto y se
# destruye al terminar, asi que cada corrida parte de una base vacia
# y los tests no se ensucian entre si ni tocan ./data/amicus.
# ============================================================

spring.datasource.url=jdbc:h2:mem:amicus-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop y no update: las tablas se arman desde cero en cada corrida.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# El SQL de Hibernate ensucia la salida de los tests sin aportar nada.
spring.jpa.show-sql=false

spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
