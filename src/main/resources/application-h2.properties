# ============================================================
# Perfil de RESPALDO: H2 en archivo
#
# Se usa cuando no se puede levantar MySQL con Docker.
# Activacion:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# No hay que cambiar una sola linea de codigo Java para pasar de
# un motor al otro: esa es la promesa de JPA.
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/amicus;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
