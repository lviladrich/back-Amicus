# ============================================================
# Amicus - Configuracion por defecto (MySQL)
#
# Requiere la base levantada:  docker compose up -d
# Si no se puede usar Docker, existe el perfil de respaldo 'h2':
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================

spring.application.name=amicus
server.port=8080

# --- Base de datos MySQL ---
# createDatabaseIfNotExist: crea el esquema 'amicus' si todavia no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/amicus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=amicus
spring.datasource.password=amicus

# --- JPA / Hibernate ---
# update: Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Pool de conexiones ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# --- Errores ---
# Incluye el detalle en la respuesta JSON, util para probar con Postman.
server.error.include-message=always
server.error.include-binding-errors=always

# --- Formato de fechas en JSON ---
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Argentina/Buenos_Aires
